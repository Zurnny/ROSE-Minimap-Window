[Mod]
Name=Minimap Window
Version=1.2
Author=Zurnny
Group=
Description=While the minimap is minimized, an empty see-through window sits under the zone name and time. It shows an element chart: every element with the elements it is strong and weak against. Press its gear for a small settings panel: opacity, height and the chart on or off.\nAdd-on for the game's default UI.
Changes=Element chart in the window: every element with what it is strong and weak against (the game's own lists). Can be hidden in the gear settings.
Priority=5
