Description=While the minimap is minimized, a see-through window sits under the zone name and time with an element chart: every element with the elements it is strong and weak against. Its gear opens a small panel for opacity and the chart. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line.
Changes=New on/off switch in Options > UI > Add-ons.
