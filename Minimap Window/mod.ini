[Mod]
Name=Minimap Window
Version=1.22
Author=Zurnny
Group=
Description=A compass ring round the minimap (N, E, S and W), with its own switch, and "Turn map with player" in the Add-ons window turns the map and the compass so the way you face is always up. While the minimap is minimized, a see-through window sits under the zone name and time with an element chart: every element with the elements it is strong and weak against. Its gear opens a small panel for opacity and the chart. Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Minimap Window: the compass letters and marks now sit on the minimap's own grey ring, which turns as the compass (no extra dark band inside it).
Priority=5
