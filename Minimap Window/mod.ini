Description=While the minimap is minimized, an empty see-through window sits under the zone name and time. It shows an element chart: every element with the elements it is strong and weak against. Press its gear for a small settings panel: opacity and the chart on or off.\nAdd-on for the game's default UI.
Changes=New chart layout: Wind, Earth, Fire, Water, Neutral, Poison, Sorcery, Ghost, Holy, each with a Strong line and a Weak line; Neutral added.
Priority=5
