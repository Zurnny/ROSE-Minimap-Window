[Mod]
Name=Minimap Window
Version=1.10
Author=Zurnny
Group=
Description=While the minimap is minimized, a see-through window sits under the zone name and time with an element chart: every element with the elements it is strong and weak against. Its gear opens a small panel for opacity and the chart. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Fixed the "Could not retrieve element in view, was it destroyed?" warnings: the look that isn't in use is now hidden instead of taken out of the window.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Minimap-Window/main/Minimap%20Window/manifest.txt
