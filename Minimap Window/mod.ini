[Mod]
Name=Minimap Window
Version=1.17
Author=Zurnny
Group=
Description=While the minimap is minimized, a see-through window sits under the zone name and time with an element chart: every element with the elements it is strong and weak against. Its gear opens a small panel for opacity and the chart. Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Add-ons window: wide enough for a whole row of chat colours; the default UI Add-ons button matches the game's menu buttons better.
Priority=5
